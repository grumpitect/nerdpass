name: Bug report
description: Something in Nerdpass isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click the menu bar icon
        2. ...
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.3
    validations:
      required: true
  - type: input
    id: card
    attributes:
      label: Capture card (as shown in the panel)
      placeholder: e.g. Elgato 4K X
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (screenshots, output of Nerdpass --list-inputs)
