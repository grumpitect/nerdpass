name: Feature request
description: Suggest an idea or improvement for Nerdpass
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Nerdpass to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (mockups, examples from other apps)
